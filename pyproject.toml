[build-system]
requires = ["scikit-build-core>=0.10", "pybind11>=2.12"]
build-backend = "scikit_build_core.build"

[project]
name = "subgrid-marching"
version = "1.0.0"
description = "Intersection-free isosurface extraction with Subgrid Marching Tetrahedra"
readme = "python/README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [
    { name = "Hossein Baktash" },
    { name = "Mark Gillespie" },
    { name = "Keenan Crane" },
]
keywords = [
    "isosurface",
    "marching tetrahedra",
    "normal surfaces",
    "geometry processing",
    "mesh extraction",
    "dual contouring",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Graphics :: 3D Modeling",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = ["numpy>=1.20"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.urls]
Homepage = "https://hbaktash.github.io/projects/subgrid-marching-tetrahedra/index.html"
Repository = "https://github.com/hbaktash/subgrid-marching"
Paper = "https://doi.org/10.1145/3811358"

[tool.scikit-build]
minimum-version = "0.10"
build-dir = "build/skbuild/{wheel_tag}"

# The pure-Python half of the package; the compiled _core lands beside it via the
# install() rule in python/CMakeLists.txt.
wheel.packages = ["python/subgrid_marching"]

# Building the Python module means building the core C++ library, so skip the
# things a Python user has no use for: the viewer, the CLIs, and the C++ tests.
[tool.scikit-build.cmake.define]
SUBGRID_BUILD_PYTHON = "ON"
SUBGRID_POLYSCOPE_VIEWER = "OFF"
SUBGRID_BUILD_APPS = "OFF"
SUBGRID_BUILD_TESTS = "OFF"

[tool.scikit-build.cmake]
build-type = "Release"

# No sdist is published to PyPI: the build needs the geometry-central and
# sdf-dataset submodules, and deps/ is 117 MB, well past what belongs in (or fits
# in) a source tarball. Building from source means a recursive clone; see
# python/README.md. This exclude list only keeps a locally built sdist from
# swallowing the whole checkout.
[tool.scikit-build.sdist]
exclude = [
    "build",
    "out",
    "images",
    "reproduce",
    "data/meshes",
    "data/npz",
    "deps",
]

# ---------------------------------------------------------------------------
# Binary wheels (.github/workflows/wheels.yml). One wheel per Python version per
# platform; each is tested against python/tests before it is kept.
# ---------------------------------------------------------------------------
[tool.cibuildwheel]
build = ["cp39-*", "cp310-*", "cp311-*", "cp312-*", "cp313-*", "cp314-*"]
# PyPy has no pybind11 story worth supporting here, musl and 32-bit are not worth
# the build minutes for a research library.
skip = ["pp*", "*-musllinux_*", "*_i686", "*-win32"]
build-verbosity = 1

# Every wheel is installed into a fresh environment and put through the binding
# tests — parity against standalone/, the pipelines, and the sample meshes — so a
# broken wheel never reaches PyPI.
test-extras = ["test"]
test-command = "pytest {project}/python/tests -q"

[tool.cibuildwheel.linux]
# Persists across the five Python builds in one container, so the CPM downloads
# (fcpw, enoki) happen once instead of five times. Outside /project on purpose:
# the container runs as root and would leave root-owned files in the checkout.
environment = { CPM_SOURCE_CACHE = "/tmp/cpm-cache" }

[tool.cibuildwheel.macos]
environment = { CPM_SOURCE_CACHE = "$HOME/.cache/cpm" }

[tool.pytest.ini_options]
testpaths = ["python/tests"]
