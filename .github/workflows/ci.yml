name: CI

on:
  # Only run on PRs targeting main — not on every push — so contributors aren't
  # billed a full multi-OS build on each commit to their branch.
  pull_request:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', 'LICENSE']

# Cancel superseded runs on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: build & test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Full build with the interactive Polyscope viewer (all targets).
          - name: linux-viewer
            os: ubuntu-latest
            viewer: "ON"
          # Lightweight headless build: no Polyscope / OpenGL dependency.
          - name: linux-headless
            os: ubuntu-latest
            viewer: "OFF"
          # macOS runners are Apple Silicon (arm64) — exercises the Enoki arm64 fix.
          - name: macos-viewer
            os: macos-latest
            viewer: "ON"
          - name: macos-headless
            os: macos-latest
            viewer: "OFF"

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # Polyscope needs X11/OpenGL headers to build (only used by the viewer job,
          # but harmless to always install).
          sudo apt-get install -y \
            build-essential cmake \
            xorg-dev libglu1-mesa-dev

      # macOS runners ship cmake and clang/make; Polyscope uses native Cocoa/OpenGL,
      # so no extra dependencies are needed there.

      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DSUBGRID_POLYSCOPE_VIEWER=${{ matrix.viewer }}

      - name: Build
        run: cmake --build build -j

      - name: Test
        run: ctest --test-dir build --output-on-failure

  # The Python bindings: build the wheel the way a user would and run the binding
  # tests against it. One runner only — the C++ matrix above already covers the
  # platforms; this job checks the packaging and the bindings themselves.
  python-bindings:
    name: python bindings (pip install + pytest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake

      # Builds headless (no Polyscope), without the CLIs or the C++ test suite;
      # see the cmake defines in pyproject.toml.
      - name: pip install
        run: python -m pip install --upgrade pip && python -m pip install ".[test]" -v

      - name: Test
        run: pytest python/tests -q
